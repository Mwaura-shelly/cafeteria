<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Edit Food</title>
</head>

<body>

    <h1>Edit Food</h1>

    <form method="POST">

        <label>Food name:</label>
        <input
            type="text"
            name="name"
            value="{{ item['name'] }}"
            required
        >

        <br><br>

        <label>Price:</label>
        <input
            type="number"
            name="price"
            value="{{ item['price'] }}"
            min="0"
            required
        >

        <br><br>

        <label>Quantity:</label>
        <input
            type="number"
            name="quantity"
            value="{{ item['quantity'] }}"
            min="0"
            required
        >

        <br><br>

        <button type="submit">Save Changes</button>

    </form>

    <br>

    <a href="/admin">Back to Admin</a>

</body>
</html>
